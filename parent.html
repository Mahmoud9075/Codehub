<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متابعة تقدّم ابنك — Code Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1a2142; --gold:#b6913b; --cream:#f3eee1; --cream-card:#ffffff;
    --ink:#4a4636; --muted:#7a7460; --green:#2e7d4f;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    font-family:'Cairo', sans-serif;
    background:var(--cream);
    color:var(--ink);
    min-height:100vh;
    padding:24px 16px;
  }
  .wrap{ max-width:560px; margin:0 auto; }
  .head{ text-align:center; margin-bottom:28px; }
  .head h1{ color:var(--navy); font-size:22px; margin:0 0 6px; }
  .head p{ color:var(--muted); font-size:14px; margin:0; }
  .card{ background:var(--cream-card); border-radius:18px; padding:24px; margin-bottom:16px; box-shadow:0 8px 24px #1a214214; }
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .stat-box{ background:var(--cream); border-radius:12px; padding:18px; text-align:center; }
  .stat-box .num{ font-size:28px; font-weight:900; color:var(--navy); }
  .stat-box .lbl{ font-size:12px; color:var(--muted); margin-top:4px; }
  .row{ display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid #0000000f; font-size:14px; }
  .row:last-child{ border-bottom:none; }
  .score{ font-weight:800; color:var(--green); }
  .msg{ text-align:center; color:var(--muted); padding:30px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <h1 id="student-name">جاري التحميل...</h1>
      <p>متابعة تقدّم ابنك في Code Hub</p>
    </div>

    <div class="card">
      <div class="stat-grid" id="stat-grid"></div>
    </div>

    <div class="card">
      <h3 style="color:var(--navy);margin:0 0 12px;">آخر النتائج</h3>
      <div id="results-list"><p class="msg">جاري التحميل...</p></div>
    </div>
  </div>

<script>
(function(){
  var API_BASE = 'https://codehub-blue-kappa.vercel.app'; // 👈 حط هنا رابط فيرسيل بتاعك، نفس ما حطيته في الموقع الرئيسي

  var params = new URLSearchParams(location.search);
  var token = params.get('token');

  if (!token || !API_BASE){
    document.getElementById('student-name').textContent = 'اللينك غير صحيح';
    document.getElementById('results-list').innerHTML = '<p class="msg">تأكد إنك فاتح اللينك اللي بعته لك الطالب بالظبط.</p>';
    return;
  }

  fetch(API_BASE + '/api/parent-view?token=' + encodeURIComponent(token))
    .then(function(r){ return r.json().then(function(data){ if (!r.ok) throw new Error(data.error); return data; }); })
    .then(function(data){
      document.getElementById('student-name').textContent = data.student.first_name + ' ' + data.student.last_name;

      document.getElementById('stat-grid').innerHTML =
        '<div class="stat-box"><div class="num">' + data.quizzes_completed + '</div><div class="lbl">كويزات مكتملة</div></div>' +
        '<div class="stat-box"><div class="num">' + (data.average_percent != null ? data.average_percent + '%' : '—') + '</div><div class="lbl">المعدل العام</div></div>';

      var list = document.getElementById('results-list');
      if (!data.results.length){
        list.innerHTML = '<p class="msg">لسه مفيش نتائج مسجّلة.</p>';
        return;
      }
      list.innerHTML = data.results.map(function(r){
        return '<div class="row"><span>' + (r.month || '') + ' — ' + (r.quiz || '') + '</span><span class="score">' + r.score + '/' + r.total + '</span></div>';
      }).join('');
    })
    .catch(function(err){
      document.getElementById('student-name').textContent = 'حصل خطأ';
      document.getElementById('results-list').innerHTML = '<p class="msg">' + err.message + '</p>';
    });
})();
</script>
</body>
</html>
